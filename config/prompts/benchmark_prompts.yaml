  ambiguity:
    template_id: ambignq_numbered_v3
    text: |
      The question may have more than one reasonable interpretation.
      Identify the major interpretations intended by the question.
      For each interpretation, provide one brief factual answer.
      Use exactly:
      Interpretation 1: <brief interpretation>
      Answer 1: <brief answer>
      Add numbered interpretations only when necessary.
      Do not explain or speculate.

      Question:
      {question}
    checksum: 052ab576788bedb025e01110ef4b58a096574ad834a5d0fc730d208c39ef39df
  context_grounded:
    template_id: squad_strict_concise_v2
    text: |
      Answer the question using only the provided context.
      Return only one short answer phrase.
      Do not explain your reasoning.
      Do not write a sentence unless the answer itself requires one.
      If the context does not contain the answer, return exactly:
      UNANSWERABLE

      Context:
      {context}

      Question:
      {question}

      Answer:
