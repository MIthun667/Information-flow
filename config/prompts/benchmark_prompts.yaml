templates:
  gsm8k:
    template_id: gsm8k_five_shot_concise_v4
    text: |
      Solve each problem concisely and end with the required final line.

      Question: Lina has 3 bags with 4 apples each. How many apples?
      Reasoning: 3 times 4 is 12.
      Final answer: 12

      Question: A book costs $18 after a $7 discount. What was its original price?
      Reasoning: Add the discount back: 18 plus 7 is 25.
      Final answer: 25

      Question: There are 30 students split equally into 5 groups. How many per group?
      Reasoning: 30 divided by 5 is 6.
      Final answer: 6

      Question: Omar read 15 pages Monday and 22 Tuesday. How many pages total?
      Reasoning: 15 plus 22 is 37.
      Final answer: 37

      Question: A tank held 50 liters and 18 liters were used. How many remain?
      Reasoning: 50 minus 18 is 32.
      Final answer: 32

      Solve the next problem with concise reasoning. End with a line exactly:
      Final answer: <number>

      Question: {question}
    checksum: 365309e799b08fdc75849a9d2b95a60a0a0706ba0e9a58e0ae283a6917377822
